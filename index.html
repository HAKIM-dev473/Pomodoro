<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="./Apple.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Timer</title>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap');

      :root{
        --bg0:#050507;
        --bg1:#0a0a12;
        --neon: #00fff2;
        --neon2: #ff2bd6;
        --neon-dim: rgba(0,255,242,.35);
        --card: rgba(10,12,18,.72);
        --card2: rgba(6,7,12,.72);
        --border: rgba(0,255,242,.22);
        --txt: #d8fdfb;
        --muted: rgba(180,220,220,.55);
        --shadow: 0 30px 80px rgba(0,0,0,.7);
        --r: 10px;
        --btn: rgba(0,255,242,.05);
        --btnHover: rgba(0,255,242,.12);
        --danger: rgba(255, 45, 85, .18);
        --dangerHover: rgba(255, 45, 85, .32);
        --ok: #39ff8f;
        --okHover: #7dffb5;
      }

      *{ box-sizing:border-box; margin:0; padding:0; }
      html, body { height:100%; }
      body{
        font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', ui-monospace, monospace;
        color: var(--txt);
        background:
          repeating-linear-gradient(0deg, rgba(0,255,242,.035) 0px, rgba(0,255,242,.035) 1px, transparent 1px, transparent 42px),
          repeating-linear-gradient(90deg, rgba(0,255,242,.035) 0px, rgba(0,255,242,.035) 1px, transparent 1px, transparent 42px),
          radial-gradient(1100px 650px at 15% 15%, rgba(0,255,242,.10), transparent 60%),
          radial-gradient(900px 600px at 85% 20%, rgba(255,43,214,.09), transparent 55%),
          linear-gradient(180deg, var(--bg0), var(--bg1));
        overflow-x:hidden;
        display:grid;
        place-items:center;
        padding: 28px 16px;
      }

      /* animated background glow blobs */
      .bg-orb{
        position: fixed;
        inset: auto;
        width: 520px;
        height: 520px;
        border-radius: 999px;
        filter: blur(90px);
        opacity: .18;
        z-index: -1;
        animation: float 10s ease-in-out infinite;
        pointer-events:none;
      }
      .orb1{ left:-180px; top:-160px; background: radial-gradient(circle at 30% 30%, var(--neon), transparent 60%); }
      .orb2{ right:-220px; top:40px; background: radial-gradient(circle at 30% 30%, var(--neon2), transparent 60%); animation-delay: -3.2s; }
      .orb3{ right:10%; bottom:-240px; background: radial-gradient(circle at 30% 30%, var(--neon), transparent 60%); animation-delay: -6.4s; }
      @keyframes float{
        0%,100%{ transform: translate3d(0,0,0) scale(1); }
        50%{ transform: translate3d(0,-22px,0) scale(1.05); }
      }

      .shell{
        width: min(980px, 100%);
        display:grid;
        grid-template-columns: 1.1fr .9fr;
        gap: 18px;
      }
      @media (max-width: 860px){
        .shell{ grid-template-columns: 1fr; }
      }

      .card{
        background: linear-gradient(180deg, var(--card), var(--card2));
        border: 1px solid var(--border);
        border-radius: var(--r);
        box-shadow: var(--shadow), 0 0 0 1px rgba(0,255,242,.05), 0 0 40px rgba(0,255,242,.06);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        overflow:hidden;
        position: relative;
      }

      .card::before{
        content:"";
        position:absolute;
        inset:-2px;
        background: radial-gradient(700px 320px at 10% 0%, rgba(0,255,242,.08), transparent 55%),
                    radial-gradient(520px 260px at 90% 10%, rgba(255,43,214,.06), transparent 55%);
        pointer-events:none;
      }

      .card::after{
        content:"";
        position:absolute;
        left:0; right:0; top:0;
        height:2px;
        background: linear-gradient(90deg, transparent, var(--neon), transparent);
        opacity:.6;
      }

      .left{
        padding: 22px 22px 18px;
      }

      .topbar{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .brand{
        display:flex;
        flex-direction:column;
        gap: 2px;
      }
      .brand h1{
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        display:flex;
        align-items:center;
        gap: 10px;
        color: var(--txt);
        text-shadow: 0 0 12px var(--neon-dim);
      }
      .chip{
        display:inline-flex;
        align-items:center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 3px;
        border: 1px solid rgba(0,255,242,.28);
        background: rgba(0,255,242,.04);
        color: var(--muted);
        font-size: 11.5px;
        letter-spacing: .5px;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .dot{
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: rgba(180,220,220,.35);
        box-shadow: 0 0 0 6px rgba(180,220,220,.06);
      }
      .dot.on{ background: var(--ok); box-shadow: 0 0 8px var(--ok), 0 0 0 6px rgba(57,255,143,.14); }
      .dot.pause{ background: #ffcc00; box-shadow: 0 0 8px #ffcc00, 0 0 0 6px rgba(255,204,0,.14); }

      .inputs{
        display:grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 14px 0 16px;
      }

      .field{
        display:flex;
        flex-direction:column;
        gap: 8px;
      }
      label{
        color: var(--muted);
        font-size: 11px;
        letter-spacing:1px;
        text-transform: uppercase;
      }

      .control{
        display:flex;
        align-items:center;
        gap: 10px;
        padding: 12px 12px;
        border-radius: 4px;
        border: 1px solid rgba(0,255,242,.18);
        background: rgba(0,0,0,.45);
        transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
      }
      .control:focus-within{
        border-color: var(--neon);
        background: rgba(0,0,0,.62);
        box-shadow: 0 0 0 1px var(--neon-dim), 0 0 16px rgba(0,255,242,.15);
        transform: translateY(-1px);
      }
      input{
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: var(--txt);
        font-family: inherit;
        font-size: 18px;
        font-weight: 700;
      }
      input::placeholder{ color: rgba(216,253,251,.22); }
      .unit{
        color: rgba(0,255,242,.55);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .5px;
      }

      .actions{
        display:flex;
        flex-wrap:wrap;
        gap: 10px;
        margin: 12px 0 10px;
      }

      button{
        border: 1px solid rgba(0,255,242,.22);
        background: var(--btn);
        color: var(--txt);
        padding: 11px 14px;
        border-radius: 4px;
        cursor:pointer;
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing:1px;
        text-transform: uppercase;
        display:inline-flex;
        align-items:center;
        gap: 10px;
        transition: transform .16s ease, background .16s ease, border-color .16s ease, filter .16s ease, box-shadow .16s ease;
        user-select:none;
      }
      button:hover{
        background: var(--btnHover);
        border-color: var(--neon);
        box-shadow: 0 0 14px rgba(0,255,242,.18);
        transform: translateY(-1px);
      }
      button:active{
        transform: translateY(0px) scale(.99);
      }
      button:disabled{
        opacity:.35;
        cursor:not-allowed;
        transform:none;
        box-shadow:none;
      }

      .primary{
        background: rgba(0,255,242,.08);
        border-color: var(--neon);
        color: var(--neon);
        text-shadow: 0 0 8px var(--neon-dim);
      }
      .primary:hover{
        background: rgba(0,255,242,.14);
        box-shadow: 0 0 20px rgba(0,255,242,.3);
        filter: brightness(1.1);
      }

      .pause{
        background: rgba(255,204,0,.06);
        border-color: rgba(255,204,0,.5);
        color: #ffcc00;
      }
      .pause:hover{
        background: rgba(255,204,0,.12);
        box-shadow: 0 0 20px rgba(255,204,0,.25);
        filter: brightness(1.05);
      }

      .danger{
        background: var(--danger);
        border-color: rgba(255,45,85,.55);
        color: #ff5577;
      }
      .danger:hover{ background: var(--dangerHover); box-shadow: 0 0 20px rgba(255,45,85,.25); }

      .ghost{
        background: rgba(255,255,255,.03);
        border-color: rgba(255,255,255,.14);
      }

      .status{
        margin-top: 12px;
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.5;
        min-height: 18px;
      }

      .right{
        padding: 22px;
        display:flex;
        flex-direction:column;
        gap: 14px;
      }

      .timerWrap{
        display:grid;
        place-items:center;
        padding: 18px 10px 8px;
      }

      .ring{
        width: 250px;
        height: 250px;
        position: relative;
        display:grid;
        place-items:center;
      }
      .ring svg{
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
        filter: drop-shadow(0 0 14px rgba(0,255,242,.35));
      }
      .ring .time{
        position:absolute;
        text-align:center;
        display:flex;
        flex-direction:column;
        gap: 6px;
      }
      .time .big{
        font-variant-numeric: tabular-nums;
        font-size: 46px;
        font-weight: 800;
        letter-spacing: 1px;
        color: var(--neon);
        text-shadow: 0 0 16px rgba(0,255,242,.55), 0 0 40px rgba(0,255,242,.2);
      }
      .time .small{
        color: var(--muted);
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .stats{
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap: 12px;
        padding: 14px 14px;
        border-radius: 4px;
        border: 1px solid rgba(0,255,242,.18);
        background: rgba(0,0,0,.45);
      }
      .stats .k{
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .stats .v{
        font-weight: 800;
        font-size: 17px;
        color: var(--neon2);
        text-shadow: 0 0 10px rgba(255,43,214,.35);
      }

      .hint{
        padding: 14px 14px;
        border-radius: 4px;
        border: 1px dashed rgba(0,255,242,.22);
        background: rgba(0,255,242,.03);
        color: rgba(216,253,251,.55);
        font-size: 11.5px;
        line-height: 1.5;
      }

      /* subtle entry animation */
      .card{
        animation: enter .55s ease both;
      }
      @keyframes enter{
        from{ opacity: 0; transform: translateY(10px); }
        to{ opacity: 1; transform: translateY(0); }
      }
    </style>

  </head>

  <body>
    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>

    <main class="shell">
      <section class="card left" aria-label="Controls">
        <div class="topbar">
          <div class="brand">
            <h1>🎯 Study Timer</h1>
          </div>

          <div class="chip" id="modeChip" title="Current mode">
            <span class="dot" id="modeDot"></span>
            <span id="modeText">Idle</span>
          </div>
        </div>

        <div class="inputs">
          <div class="field">
            <label for="studyHours">Hours</label>
            <div class="control">
              <input type="number" id="studyHours" placeholder="0" min="0" inputmode="numeric" />
              <span class="unit">h</span>
            </div>
          </div>

          <div class="field">
            <label for="studyMinutes">Minutes</label>
            <div class="control">
              <input type="number" id="studyMinutes" placeholder="25" min="0" inputmode="numeric" />
              <span class="unit">min</span>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="primary" id="startBtn" type="button">▶ Start</button>
          <button class="pause" id="pauseBtn" type="button" disabled>⏸ Pause</button>
          <button class="ghost" id="resetBtn" type="button">↺ Reset</button>
        </div>

        <div class="status" id="status">Enter time and click start.</div>
      </section>

      <aside class="card right" aria-label="Timer">
        <div class="timerWrap">
          <div class="ring" role="img" aria-label="Progress ring">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <!-- track -->
              <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="10" />
              <!-- progress -->
              <circle
                id="progressCircle"
                cx="60" cy="60" r="50"
                fill="none"
                stroke="rgba(255,255,255,.85)"
                stroke-width="10"
                stroke-linecap="round"
                stroke-dasharray="314.159"
                stroke-dashoffset="314.159"
              />
            </svg>

            <div class="time">
              <div class="big" id="timerDisplay">00:00</div>
              <div class="small" id="subtitle">Ready when you are.</div>
            </div>
          </div>
        </div>

        <div class="stats">
          <div>
            <div class="k">Total Study Time</div>
            <div class="v"><span id="totalTime">0</span> <span class="k">hh:mm</span> </div>
          </div>
          <div style="text-align:right;">
            <div class="k">Session</div>
            <div class="v"><span id="sessionLabel">—</span></div>
          </div>
        </div>

        <div class="hint">
          Tip: Pause can be resumed later (even after refresh). The timer only counts down while running.
        </div>
      </aside>
    </main>

    <script>
const DATE_KEY = "studyDate";
      const timerDisplay = document.getElementById('timerDisplay');
      const subtitle = document.getElementById('subtitle');
      const sessionLabel = document.getElementById('sessionLabel');

      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const resetBtn = document.getElementById('resetBtn');

      const inputH = document.getElementById('studyHours');
      const inputM = document.getElementById('studyMinutes');
      const status = document.getElementById('status');

      const totalTimeDisplay = document.getElementById('totalTime');
      const progressCircle = document.getElementById('progressCircle');

      const modeChip = document.getElementById('modeChip');
      const modeDot = document.getElementById('modeDot');
      const modeText = document.getElementById('modeText');

      let timerInterval = null;

      let endTimestamp = null;
      let runningMinutes = 0;

      let isPaused = false;
      let remainingMs = 0;

      const TOTAL_KEY = 'totalStudyTime';
      const RUNNING_KEY = 'runningStudySession';

      const RING_CIRC = 314.159; // 2*pi*50

      let alarmSound = null;
      function loadAlarmSound() {
        try {
          alarmSound = new Audio('alarm.mp3');
          alarmSound.preload = 'auto';
        } catch (e) {
          console.log("Error loading alarm sound");
          alarmSound = null;
        }
      }
      function playAlarm() {
        if (!alarmSound) return;
        alarmSound.currentTime = 0;
        alarmSound.play().catch(() => console.log("Sound blocked by browser"));
      }

function loadTotalTime() {

  const today = new Date().toDateString();
  const savedDate = localStorage.getItem(DATE_KEY);

  if (savedDate !== today) {
    localStorage.setItem(DATE_KEY, today);
    localStorage.setItem(TOTAL_KEY, "0");
  }

  return parseInt(localStorage.getItem(TOTAL_KEY) || '0', 10);
}
   
function updateTotalDisplay(totalMinutes) {
  const h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;

  const hh = String(h).padStart(2, '0');
  const mm = String(m).padStart(2, '0');

  totalTimeDisplay.textContent = `${hh}:${mm}`;
}

      function saveTotalTime(addMinutes) {
        const current = loadTotalTime();
        const next = current + addMinutes;
        localStorage.setItem(TOTAL_KEY, String(next));
        updateTotalDisplay(next);
      }

      function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }

      function setModeUI(mode) {
        // mode: 'idle' | 'running' | 'paused'
        modeDot.classList.remove('on', 'pause');
        if (mode === 'running') {
          modeDot.classList.add('on');
          modeText.textContent = 'Focus';
          subtitle.textContent = 'Stay locked in.';
        } else if (mode === 'paused') {
          modeDot.classList.add('pause');
          modeText.textContent = 'Paused';
          subtitle.textContent = 'Paused. Resume when ready.';
        } else {
          modeText.textContent = 'Idle';
          subtitle.textContent = 'Ready when you are.';
        }
      }

      function setProgress(secondsLeft) {
        const totalSeconds = Math.max(1, runningMinutes * 60);
        const progress = Math.min(1, Math.max(0, 1 - (secondsLeft / totalSeconds)));
        const dash = RING_CIRC * (1 - progress);
        progressCircle.style.strokeDasharray = String(RING_CIRC);
        progressCircle.style.strokeDashoffset = String(dash);
      }

      function setRunningSession(payload) {
        // payload: { end:number|null, minutes:number, paused:boolean, remainingMs:number }
        runningMinutes = payload.minutes;
        isPaused = !!payload.paused;
        remainingMs = payload.remainingMs || 0;
        endTimestamp = payload.end;
        localStorage.setItem(RUNNING_KEY, JSON.stringify(payload));
      }

      function clearRunningSession() {
        endTimestamp = null;
        runningMinutes = 0;
        isPaused = false;
        remainingMs = 0;
        localStorage.removeItem(RUNNING_KEY);
        document.title = "Study Timer";
        setModeUI('idle');
        sessionLabel.textContent = '—';
        setProgress(0);
      }

      function loadRunningSession() {
        const raw = localStorage.getItem(RUNNING_KEY);
        if (!raw) return null;
        try {
          const obj = JSON.parse(raw);
          const okMinutes = obj && typeof obj.minutes === 'number';
          const okPaused = obj && typeof obj.paused === 'boolean';
          // When running: need end; when paused: need remainingMs
          if (!okMinutes || !okPaused) return null;

          if (obj.paused) {
            if (typeof obj.remainingMs !== 'number') return null;
            return { end: null, minutes: obj.minutes, paused: true, remainingMs: obj.remainingMs };
          } else {
            if (typeof obj.end !== 'number') return null;
            return { end: obj.end, minutes: obj.minutes, paused: false, remainingMs: 0 };
          }
        } catch (e) {}
        return null;
      }

      function stopInterval() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function updateTick() {
        if (isPaused) return;
        if (!endTimestamp) return;

        const now = Date.now();
        let secondsLeft = Math.ceil((endTimestamp - now) / 1000);
        if (secondsLeft < 0) secondsLeft = 0;

        timerDisplay.textContent = formatTime(secondsLeft);
        document.title = `⏱️ ${formatTime(secondsLeft)} left – Study Timer`;
        setProgress(secondsLeft);

        if (secondsLeft <= 0) onComplete();
      }

      function startIntervalIfNeeded() {
        if (timerInterval) return;
        updateTick();
        timerInterval = setInterval(updateTick, 500);
      }

      function lockInputs(locked) {
        inputH.disabled = locked;
        inputM.disabled = locked;
        startBtn.disabled = locked;
      }

      function startTimer() {
        if (endTimestamp || isPaused) return;

let h = parseInt(inputH.value || '0', 10);
let m = parseInt(inputM.value || '0', 10);

if (h === 0 && m === 0) {
  m = 25;
}

const totalMinutes = h * 60 + m;

        const now = Date.now();
        const end = now + totalMinutes * 60 * 1000;

        setRunningSession({ end, minutes: totalMinutes, paused: false, remainingMs: 0 });

        lockInputs(true);
        pauseBtn.disabled = false;
        pauseBtn.textContent = "⏸ Pause";

        status.textContent = "Focus mode started!";
        sessionLabel.textContent = `${totalMinutes} min`;
        setModeUI('running');
        startIntervalIfNeeded();
      }

      function pauseOrResume() {
        if ((!endTimestamp && !isPaused) || runningMinutes <= 0) return;

        if (!isPaused) {
          // Pause
          const now = Date.now();
          remainingMs = Math.max(0, endTimestamp - now);
          isPaused = true;
          endTimestamp = null;

          stopInterval();

          setRunningSession({ end: null, minutes: runningMinutes, paused: true, remainingMs });

          pauseBtn.textContent = "▶ Resume";
          status.textContent = "Paused. You can close the tab and resume later.";
          setModeUI('paused');

          const secondsLeft = Math.ceil(remainingMs / 1000);
          timerDisplay.textContent = formatTime(secondsLeft);
          document.title = `⏸️ Paused – Study Timer`;
          setProgress(secondsLeft);
        } else {
          // Resume
          const now = Date.now();
          const end = now + remainingMs;

          isPaused = false;
          endTimestamp = end;

          setRunningSession({ end, minutes: runningMinutes, paused: false, remainingMs: 0 });

          pauseBtn.textContent = "⏸ Pause";
          status.textContent = "Resumed. Focus mode running!";
          setModeUI('running');

          startIntervalIfNeeded();
        }
      }

      function onComplete() {
        // Only complete if we are actively running
        if (!endTimestamp || isPaused) return;

        stopInterval();
        saveTotalTime(runningMinutes);
        clearRunningSession();

        timerDisplay.textContent = "00:00";
        lockInputs(false);
        pauseBtn.disabled = true;
        pauseBtn.textContent = "⏸ Pause";

        status.textContent = "Session completed! Enter new time to start again.";
        playAlarm();
      }

      function resetTimer() {
        stopInterval();
        clearRunningSession();

        lockInputs(false);
        pauseBtn.disabled = true;
        pauseBtn.textContent = "⏸ Pause";

        timerDisplay.textContent = "00:00";
        status.textContent = "Enter time and click start.";
        setProgress(0);
      }



      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) updateTick();
      });
      window.addEventListener('focus', updateTick);

      window.addEventListener('load', () => {
        loadAlarmSound();
        updateTotalDisplay(loadTotalTime());
        setModeUI('idle');
        setProgress(0);

        const running = loadRunningSession();
        if (!running) return;

        runningMinutes = running.minutes;
        sessionLabel.textContent = `${runningMinutes} min`;

        lockInputs(true);
        pauseBtn.disabled = false;

        if (running.paused) {
          isPaused = true;
          remainingMs = running.remainingMs;
          endTimestamp = null;

          pauseBtn.textContent = "▶ Resume";
          status.textContent = "Session is paused. Resume when ready.";
          setModeUI('paused');

          const secondsLeft = Math.ceil(remainingMs / 1000);
          timerDisplay.textContent = formatTime(secondsLeft);
          document.title = `⏸️ Paused – Study Timer`;
          setProgress(secondsLeft);
        } else {
          const now = Date.now();
          if (running.end > now) {
            isPaused = false;
            endTimestamp = running.end;

            pauseBtn.textContent = "⏸ Pause";
            status.textContent = "Resuming your running session...";
            setModeUI('running');
            startIntervalIfNeeded();
          } else {
            // finished while away
            saveTotalTime(running.minutes);
            clearRunningSession();

            timerDisplay.textContent = "00:00";
            lockInputs(false);
            pauseBtn.disabled = true;
            pauseBtn.textContent = "⏸ Pause";

            status.textContent = "Previous session completed while you were away.";
          }
        }
      });

      startBtn.addEventListener('click', startTimer);
      pauseBtn.addEventListener('click', pauseOrResume);
      resetBtn.addEventListener('click', resetTimer);

[inputH, inputM].forEach(el => {
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      startTimer();
    }
  });
});

      window.addEventListener('beforeunload', stopInterval);
    </script>
  </body>
</html>
